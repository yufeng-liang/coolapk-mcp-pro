name: CI

# push 与 PR 都触发；matrix 覆盖声明的最低版本 3.10、常用的 3.12 与本地实测的 3.14。
# push 排除 v* tag：发版由 release.yml 负责，别为同一个 tag 再跑一遍五作业 matrix（含 docker build）
on:
  push:
    tags-ignore: ["v*"]
  pull_request:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一分支的旧运行直接取消：push 风暴时别占满 runner 还发一堆过期通知
concurrency:
  # push 的 ref 是 refs/heads/x，PR 的是 refs/pull/N/merge：不统一到 head_ref 会出现同分支两份并发
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 不是凑数：starlette 1.8+ 要求 >=3.11，只有 3.12/3.14 腿会掩盖 3.10 的旧依赖组合
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（含 dev 可选依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: ruff check .

      - name: Mypy 类型检查
        run: mypy

      - name: Pytest 单元测试 + 覆盖率门槛
        # pyproject 的 addopts 已带 -q，这里再传 -q 会叠成 -qq 把通过数一起吞掉。
        # 门槛 60%：当前基线 68%，留出波动空间，但挡住“新增整块代码零测试”。
        run: pytest -q -o addopts="" -rs --cov=coolapk_mcp --cov-report=term-missing:skip-covered --cov-fail-under=60

      - name: CLI 冒烟（入口点装配是否完好）
        run: coolapk --help > /dev/null

      - name: 字节码编译检查（语法级冒烟）
        run: python -m compileall -q coolapk_mcp

  windows:
    # 本项目主要用户在 Windows 跑桌面端，权限/路径分支（icacls、chmod skip）
    # 只有这条腿能真实覆盖；单版本即可，不复制三份 matrix。
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest + 覆盖率门槛
        # 与 Linux 腿同一门槛：补测在哪个平台掉下去都要拦住
        run: pytest -q -o addopts="" -rs --cov=coolapk_mcp --cov-fail-under=60

      - name: CLI 冒烟
        run: coolapk --help | Out-Null

  docker:
    # 镜像能 build 且非 root 用户能跑起 CLI，才算 Dockerfile 没腐化
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 用了 --mount=type=cache，必须先有 BuildKit builder
      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        run: docker build -t coolapk-mcp:ci .

      - name: 容器内 CLI 冒烟（验证 USER 与依赖层）
        run: docker run --rm --entrypoint coolapk coolapk-mcp:ci --help
