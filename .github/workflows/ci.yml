name: CI

# push 与 PR 都触发；matrix 覆盖声明的最低版本 3.10 与较新的 3.12
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（含 dev 可选依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: ruff check .

      - name: Pytest 单元测试
        run: pytest -q

      - name: 字节码编译检查（语法级冒烟）
        run: python -m compileall -q coolapk_mcp
