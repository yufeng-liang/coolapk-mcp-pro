[project]
name = "coolapk-mcp-pro"
version = "0.3.1"
description = "酷安社区 MCP Server — AI 原生搜索工具"
requires-python = ">=3.10"
dependencies = [
    # server.py 顶层 from mcp.server.fastmcp import TransportSecuritySettings 需要较新 mcp（实测 1.30.0）
    "mcp>=1.30,<2",
    "httpx>=0.27",
    "bcrypt>=4.0",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "pywebview>=5.0; sys_platform == 'win32'",
    # uvicorn：server.py HTTP 模式直接 import，不能依赖 mcp 包的传递依赖保证
    "uvicorn>=0.23",
    # click：cli.py 直接 import，此前靠 uvicorn 传递依赖带入
    "click>=8.0",
]

[project.scripts]
coolapk = "coolapk_mcp.cli:cli"
coolapk-mcp = "coolapk_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coolapk_mcp*"]
