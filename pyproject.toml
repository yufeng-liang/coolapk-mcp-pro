[project]
name = "coolapk-mcp-pro"
version = "0.6.9"
description = "酷安社区 MCP Server — AI 原生搜索工具"
requires-python = ">=3.10"
dependencies = [
    # server.py 顶层 from mcp.server.fastmcp import TransportSecuritySettings 需要较新 mcp（实测 1.30.0）
    "mcp>=1.30,<2",
    "httpx>=0.27",
    "bcrypt>=4.0",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "pywebview>=5.0; sys_platform == 'win32'",
    # uvicorn：server.py HTTP 模式直接 import，不能依赖 mcp 包的传递依赖保证
    "uvicorn>=0.23",
    # click：cli.py 直接 import，此前靠 uvicorn 传递依赖带入
    "click>=8.0",
    # websocket-client：浏览器 CDP 登录（coolapk login --web）读取 Cookie 用，纯 Python 无需编译
    "websocket-client>=1.6",
]

[project.optional-dependencies]
# 开发/CI 依赖：pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
coolapk = "coolapk_mcp.cli:cli"
coolapk-mcp = "coolapk_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coolapk_mcp*"]

[tool.pytest.ini_options]
# pytest-asyncio 自动模式：async def 测试无需逐个加 @pytest.mark.asyncio
asyncio_mode = "auto"
# 异步 fixture 的事件循环作用域显式声明，避免 pytest-asyncio 新版的弃用告警
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# 临时目录（tmp*/ 已在 .gitignore 忽略）里是历史脚本，不参与检查
exclude = [".venv", "tmp*"]

[tool.ruff.lint]
# 只开真实错误：语法/未定义名/未使用变量等，风格类规则等业务代码清理完再逐步加
select = ["E9", "F63", "F7", "F82"]
